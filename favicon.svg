<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d1f"/>
      <stop offset="100%" stop-color="#18103a"/>
    </linearGradient>
    <linearGradient id="bub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#43e97b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark bg -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none"
        stroke="rgba(108,99,255,0.25)" stroke-width="1"/>

  <!-- glow halo behind bubble -->
  <path opacity="0.22" filter="url(#softglow)"
    d="M10 13 Q10 8 15 8 H49 Q54 8 54 13 V37 Q54 42 49 42
       H35 L24 56 V42 H15 Q10 42 10 37 Z"
    fill="url(#bub)"/>

  <!-- main bubble -->
  <path filter="url(#glow)"
    d="M10 13 Q10 8 15 8 H49 Q54 8 54 13 V37 Q54 42 49 42
       H35 L24 56 V42 H15 Q10 42 10 37 Z"
    fill="none"
    stroke="url(#bub)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- three glowing dots -->
  <circle cx="23" cy="25" r="3" fill="url(#bub)" filter="url(#glow)"/>
  <circle cx="32" cy="25" r="3" fill="url(#bub)" filter="url(#glow)"/>
  <circle cx="41" cy="25" r="3" fill="url(#bub)" filter="url(#glow)"/>
</svg>
