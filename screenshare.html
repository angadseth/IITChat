<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT Chat — Screen Share</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }

  #sv {
    width:100vw; height:100vh;
    object-fit:contain;
    display:none;
  }

  /* fullscreen button — bottom right, fades unless hovered */
  #fs-btn {
    position:fixed; bottom:18px; right:18px;
    background:rgba(10,10,22,0.75); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff; font-size:18px; width:42px; height:42px;
    border-radius:10px; cursor:pointer;
    display:none; align-items:center; justify-content:center;
    opacity:0; transition:opacity .3s;
  }
  body:hover #fs-btn { opacity:1; }

  /* click-to-unmute banner */
  #mute-bar {
    position:fixed; top:0; left:0; right:0;
    background:rgba(108,99,255,0.92); color:#fff;
    font-family:'Sora',system-ui,sans-serif; font-size:13px; font-weight:600;
    padding:10px 18px; text-align:center; cursor:pointer;
    display:none; z-index:100;
  }

  /* waiting / ended overlay */
  #overlay {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:#fff; font-family:'Sora',system-ui,sans-serif; text-align:center;
    background:#000;
  }
  .wico  { font-size:52px; animation:pulse 2s ease infinite; }
  .wtitle{ font-size:20px; font-weight:700; }
  .wsub  { font-size:13px; color:#9090b0; }
  .spin  { width:36px;height:36px;border-radius:50%;border:3px solid rgba(108,99,255,.2);border-top-color:#6c63ff;animation:sp .9s linear infinite; }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<video id="sv" autoplay playsinline></video>
<button id="fs-btn" onclick="toggleFS()" title="Fullscreen">⛶</button>
<div id="mute-bar" onclick="unmute()">🔊 Click here to enable sound</div>

<div id="overlay">
  <div class="wico">🖥️</div>
  <div class="wtitle" id="otitle">Connecting…</div>
  <div class="wsub"  id="osub">Waiting for screen stream</div>
  <div class="spin"  id="ospn"></div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FC = {
  apiKey:            "AIzaSyBUkQ3ykM5ErEKeLSfClIuaU7Qtokwg0Ek",
  authDomain:        "iitchat-ef6a0.firebaseapp.com",
  databaseURL:       "https://iitchat-ef6a0-default-rtdb.firebaseio.com",
  projectId:         "iitchat-ef6a0",
  storageBucket:     "iitchat-ef6a0.firebasestorage.app",
  messagingSenderId: "701410820532",
  appId:             "1:701410820532:web:1c975bcfd5812c10f132e1"
};

const ICE = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    {
      urls: [
        'turn:openrelay.metered.ca:80',
        'turn:openrelay.metered.ca:443',
        'turn:openrelay.metered.ca:443?transport=tcp'
      ],
      username:   'openrelayproject',
      credential: 'openrelayproject'
    }
  ]
};

const fb   = initializeApp(FC);
const db   = getDatabase(fb);
const auth = getAuth(fb);
const CCI  = new URLSearchParams(location.search).get('cci');
const vid  = document.getElementById('sv');

function showEnded(msg) {
  vid.style.display                                  = 'none';
  document.getElementById('fs-btn').style.display   = 'none';
  document.getElementById('mute-bar').style.display = 'none';
  document.getElementById('overlay').style.display  = 'flex';
  document.getElementById('otitle').textContent     = 'Share Ended';
  document.getElementById('osub').textContent       = msg || 'The screen share has stopped.';
  document.getElementById('ospn').style.display     = 'none';
}

window.toggleFS = () => {
  if (!document.fullscreenElement) vid.requestFullscreen?.();
  else document.exitFullscreen?.();
};

window.unmute = () => {
  vid.muted = false;
  document.getElementById('mute-bar').style.display = 'none';
};

if (!CCI) { showEnded('Invalid session.'); }
else {
  onAuthStateChanged(auth, u => {
    if (!u) { showEnded('Please sign in to IIT Chat first.'); return; }
    connect();
  });
}

async function connect() {
  const snap = await get(ref(db, `screenShare/${CCI}`));
  const data = snap.val();
  if (!data?.active || !data?.offer) { showEnded('No active screen share found.'); return; }

  const pc = new RTCPeerConnection(ICE);

  pc.ontrack = e => {
    vid.srcObject = e.streams[0];
    // try with audio; if blocked, show mute bar
    vid.muted = false;
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().then(() => {
        document.getElementById('mute-bar').style.display = 'block';
      });
    });
    vid.style.display = 'block';
    document.getElementById('fs-btn').style.display  = 'flex';
    document.getElementById('overlay').style.display = 'none';
  };

  pc.onicecandidate = e => {
    if (e.candidate) push(ref(db, `screenShare/${CCI}/ice_viewer`), e.candidate.toJSON());
  };

  // set remote desc first, then listen for sharer ICE
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await set(ref(db, `screenShare/${CCI}/answer`), { sdp: ans.sdp, type: ans.type });

  // sharer ICE — track seen keys to avoid re-processing
  const seenKeys = new Set();
  onValue(ref(db, `screenShare/${CCI}/ice_sharer`), s => {
    s.forEach(child => {
      if (seenKeys.has(child.key)) return;
      seenKeys.add(child.key);
      pc.addIceCandidate(new RTCIceCandidate(child.val())).catch(() => {});
    });
  });

  // watch for share ending
  onValue(ref(db, `screenShare/${CCI}`), s => {
    if (!s.val()?.active) showEnded('The screen share has ended.');
  });
}
</script>
</body>
</html>
